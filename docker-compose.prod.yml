# Stack Docker para PC (produção local) — ver docs/DOCKER_PC.md
# Uso: Copy-Item .env.docker.example .env  &&  docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:?defina PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE:-alygen_crm}
    volumes:
      - alygen_pg_data_prod:/var/lib/postgresql/data
    networks:
      - alygen-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-alygen_crm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend_python:
    build:
      context: ./backend_python
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PYTHON_PORT: "3003"
      PYTHON_HOST: 0.0.0.0
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    env_file:
      - ./backend/.env
    networks:
      - alygen-prod
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: "3001"
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:?defina PGPASSWORD}
      PGDATABASE: ${PGDATABASE:-alygen_crm}
      PYTHON_FASTAPI_URL: http://backend_python:3003
      PYTHON_SERVICE_URL: http://backend_python:3003
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      ALYGEN_API_KEY: ${ALYGEN_API_KEY:?defina ALYGEN_API_KEY}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    env_file:
      - ./backend/.env
    volumes:
      - alygen_screenshots:/app/screenshots
    networks:
      - alygen-prod
    depends_on:
      postgres:
        condition: service_healthy
      backend_python:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/api/health/live', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    image: alygencrm-frontend-prod
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ""
        VITE_REQUIRE_AUTH: "true"
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    networks:
      - alygen-prod
    depends_on:
      backend:
        condition: service_healthy

networks:
  alygen-prod:
    driver: bridge

volumes:
  alygen_pg_data_prod:
  alygen_screenshots:
